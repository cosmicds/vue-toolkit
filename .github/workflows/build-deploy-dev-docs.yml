name: Build and Deploy Development Docs

on:
  push:
    branches:
      main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use a faster apt mirror
        run: |
          MIRROR="http://archive.ubuntu.com/ubuntu"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\tpriority:1\n' "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          # Fallback for images that hardcode the Azure URL in the sources file
          sudo sed -i "s|http://azure.archive.ubuntu.com/ubuntu|$MIRROR|g" \
            /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          # Retry flaky downloads instead of failing the job
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Set up yarn
        run: corepack enable && yarn set version 4.12.0

      - name: Install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook 
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VITE_CDS_API_KEY: ${{ secrets.CDS_API_KEY }}

      - name: Install browsers using Playwright
        run: yarn playwright install --with-deps

      - name: Run unit tests
        run: yarn test-unit

      - name: Run Storybook Tests
        run: yarn test-storybook

      - name: Rename docs folder to dev
        run: mv docs dev

      - name: Check out the current docs
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: docs

      - name: Move development docs into docs folder
        run: |
          rm -rf docs/dev
          mv dev docs/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          ssh-key: ${{ secrets.DEPLOY_KEY }}
